# 复合 action：安装 Node/pnpm 依赖并缓存。
# 用法：
#   - uses: ./.github/actions/setup-deps
#       with:
#         mise-install: 'node pnpm'  # 仅安装指定工具（默认安装 .mise.toml 全部）
#         skip-mise: 'true'          # 跳过 mise 工具安装
#         skip-install: 'true'       # 跳过 pnpm install（准备 job 不需要装依赖）
#         wails: 'true'              # 安装 Wails Linux 系统依赖（libgtk-4-dev, libwebkitgtk-6.0-dev）
#         go-cache: 'true'           # 拆分缓存 Go 模块（gomod）与编译产物（gobuild）
#         cache-save: 'true'         # 允许写入缓存（默认 'false' 只读恢复，仅 main 基线预热 job 开启）
name: 'Setup Dependencies'
description: 'Install tools via mise, cache pnpm store, and install dependencies'

inputs:
  mise-install:
    description: 'Space-separated tools for mise install. Empty = install all from .mise.toml'
    required: false
    default: ''
  skip-mise:
    description: 'Skip installing tools via mise'
    required: false
    default: 'false'
  skip-install:
    description: 'Skip pnpm install and pnpm-related steps'
    required: false
    default: 'false'
  wails:
    description: 'Install Wails Linux system dependencies (libgtk-4-dev, libwebkitgtk-6.0-dev)'
    required: false
    default: 'false'
  go-cache:
    description: 'Restore and save Go module/build caches after mise installs Go'
    required: false
    default: 'false'
  cache-save:
    description: 'Allow saving caches (default false: read-only restore; only main baseline warm jobs enable)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Wails Go 工具在 Linux 上编译会链接 GTK4/WebKitGTK，必须先于 mise install 安装系统库，
    # 否则 mise 编译 go:.../wails3 会因 pkg-config 找不到 gtk4/webkitgtk-6.0 而失败。
    - name: Update Wails package indexes
      if: inputs.wails == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update

    - name: Resolve Wails Linux package cache key
      if: inputs.wails == 'true' && runner.os == 'Linux'
      id: wails-apt-cache
      shell: bash
      run: |
        set -euo pipefail
        apt_cache_dir="${RUNNER_TEMP}/wails-apt-archives"
        mkdir -p "$apt_cache_dir/partial"
        chmod 1777 "$apt_cache_dir/partial"
        apt_plan="$(sudo apt-get \
          -o "Dir::Cache::archives=$apt_cache_dir" \
          --print-uris --yes --no-install-recommends install \
          libgtk-4-dev libwebkitgtk-6.0-dev)"
        apt_plan_hash="$(printf '%s\n' "$apt_plan" | sha256sum | cut -d' ' -f1)"
        source /etc/os-release
        cache_scope="${ID}-${VERSION_ID}-$(dpkg --print-architecture)"
        echo "key=${cache_scope}-${apt_plan_hash}" >> "$GITHUB_OUTPUT"
        echo "scope=${cache_scope}" >> "$GITHUB_OUTPUT"

    - name: Restore Wails Linux package archives
      if: inputs.wails == 'true' && runner.os == 'Linux'
      id: wails-apt-restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/wails-apt-archives
        key: wails-apt-${{ steps.wails-apt-cache.outputs.key }}
        restore-keys: |
          wails-apt-${{ steps.wails-apt-cache.outputs.scope }}-

    - name: Install Wails Linux prerequisites
      if: inputs.wails == 'true' && runner.os == 'Linux'
      id: wails-apt-install
      shell: bash
      run: |
        sudo apt-get \
          -o "Dir::Cache::archives=${RUNNER_TEMP}/wails-apt-archives" \
          -o APT::Keep-Downloaded-Packages=true \
          install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

    - name: Prepare Wails Linux package archives for caching
      if: >-
        inputs.wails == 'true' && runner.os == 'Linux' &&
        inputs.cache-save == 'true' &&
        steps.wails-apt-install.outcome == 'success'
      id: wails-apt-permissions
      shell: bash
      run: |
        sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/wails-apt-archives"

    - name: Save Wails Linux package archives
      if: >-
        inputs.wails == 'true' && runner.os == 'Linux' &&
        inputs.cache-save == 'true' &&
        steps.wails-apt-cache.outputs.key != '' &&
        steps.wails-apt-restore.outputs.cache-hit != 'true' &&
        steps.wails-apt-permissions.outcome == 'success' &&
        steps.wails-apt-install.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/wails-apt-archives
        key: wails-apt-${{ steps.wails-apt-cache.outputs.key }}

    - uses: jdx/mise-action@v4
      if: inputs.skip-mise != 'true'
      with:
        install: 'true'
        install_args: ${{ inputs.mise-install }}
        cache_save: ${{ inputs.cache-save }}

    - name: Resolve Go cache paths
      if: inputs.go-cache == 'true'
      id: go-cache-paths
      shell: bash
      env:
        GO_MOD_HASH: ${{ hashFiles('apps/interweave/go.mod', 'apps/interweave/go.sum') }}
        TASKFILE_HASH: ${{ hashFiles('apps/interweave/build/**/Taskfile.yml') }}
      run: |
        set -euo pipefail
        gomodcache="$(go env GOMODCACHE)"
        gocache="$(go env GOCACHE)"
        goversion="$(go env GOVERSION)"
        # 纯 POSIX 纪元周槽位：规避日历年+ISO 周跨年错位与 BSD/GNU date 差异；限制同一键前缀的周期性增长，旧条目由 GitHub 7 天 TTL 驱逐。
        week_slot="w$(( $(date -u +%s) / 604800 ))"
        {
          echo "gomodcache=${gomodcache}"
          echo "gocache=${gocache}"
          echo "goversion=${goversion}"
          echo "gomod_key=${RUNNER_OS}-${RUNNER_ARCH}-gomod-${goversion}-${GO_MOD_HASH}"
          echo "gomod_restore_prefix=${RUNNER_OS}-${RUNNER_ARCH}-gomod-${goversion}-"
          echo "gobuild_key=${RUNNER_OS}-${RUNNER_ARCH}-gobuild-${goversion}-${GO_MOD_HASH}-${TASKFILE_HASH}-${week_slot}"
          echo "gobuild_restore_taskfile=${RUNNER_OS}-${RUNNER_ARCH}-gobuild-${goversion}-${GO_MOD_HASH}-${TASKFILE_HASH}-"
          echo "gobuild_restore_mod=${RUNNER_OS}-${RUNNER_ARCH}-gobuild-${goversion}-${GO_MOD_HASH}-"
          echo "gobuild_restore_go=${RUNNER_OS}-${RUNNER_ARCH}-gobuild-${goversion}-"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      if: inputs.go-cache == 'true' && inputs.cache-save == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.gomodcache }}
        # 按平台/Go 版本/go.mod+go.sum 建键，不含提交 SHA 与镜像版本，避免非 Go 提交挤压 10GB 缓存配额。
        key: ${{ steps.go-cache-paths.outputs.gomod_key }}
        restore-keys: |
          ${{ steps.go-cache-paths.outputs.gomod_restore_prefix }}

    - name: Restore Go modules
      if: inputs.go-cache == 'true' && inputs.cache-save != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.gomodcache }}
        key: ${{ steps.go-cache-paths.outputs.gomod_key }}
        restore-keys: |
          ${{ steps.go-cache-paths.outputs.gomod_restore_prefix }}

    - name: Cache Go build artifacts
      if: inputs.go-cache == 'true' && inputs.cache-save == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.gocache }}
        # 按平台/Go 版本/go.mod+go.sum/Taskfile/纪元周槽位建键，不再按 **/*.go 滚存；
        # Go build cache 内容寻址（cgo 预处理输出参与哈希），跨镜像恢复旧条目只会在输入变化时自然 miss。
        key: ${{ steps.go-cache-paths.outputs.gobuild_key }}
        restore-keys: |
          ${{ steps.go-cache-paths.outputs.gobuild_restore_taskfile }}
          ${{ steps.go-cache-paths.outputs.gobuild_restore_mod }}
          ${{ steps.go-cache-paths.outputs.gobuild_restore_go }}

    - name: Restore Go build artifacts
      if: inputs.go-cache == 'true' && inputs.cache-save != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.go-cache-paths.outputs.gocache }}
        key: ${{ steps.go-cache-paths.outputs.gobuild_key }}
        restore-keys: |
          ${{ steps.go-cache-paths.outputs.gobuild_restore_taskfile }}
          ${{ steps.go-cache-paths.outputs.gobuild_restore_mod }}
          ${{ steps.go-cache-paths.outputs.gobuild_restore_go }}

    - name: Resolve pnpm store path
      if: inputs.skip-install != 'true'
      id: pnpm-store
      shell: bash
      env:
        PNPM_LOCK_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
      run: |
        set -euo pipefail
        {
          echo "path=$(pnpm store path)"
          echo "pnpm_key=${RUNNER_OS}-pnpm-${PNPM_LOCK_HASH}"
          echo "pnpm_restore_prefix=${RUNNER_OS}-pnpm-"
        } >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: inputs.skip-install != 'true' && inputs.cache-save == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store.outputs.pnpm_key }}
        restore-keys: |
          ${{ steps.pnpm-store.outputs.pnpm_restore_prefix }}

    - name: Restore pnpm store
      if: inputs.skip-install != 'true' && inputs.cache-save != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store.outputs.pnpm_key }}
        restore-keys: |
          ${{ steps.pnpm-store.outputs.pnpm_restore_prefix }}

    - name: Install dependencies
      if: inputs.skip-install != 'true'
      shell: bash
      # 项目 .npmrc 的 registry 优先级高于用户级配置，`pnpm config set registry` 不会改变
      # 本仓的安装源；只有 CLI flag 能覆盖。仓库本地保留镜像，CI 固定走官方源。
      run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
