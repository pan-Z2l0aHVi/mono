name: Verify Wails Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wails-verify.yml'
      - '.mise.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'apps/interweave/**'
      - 'packages/web-ui/**'
      - 'packages/browser-kit/**'
      - 'packages/js-kit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate Wails metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - name: Validate Wails version metadata
        run: node apps/interweave/scripts/sync-version.mjs --check

  build:
    name: ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 DMG
            runner: macos-14
            command: build:macos
            artifact-name: interweave-macos-arm64
            artifact-path: apps/interweave/bin/interweave.dmg
          - name: Windows x64 EXE
            runner: windows-latest
            command: build:windows
            artifact-name: interweave-windows-amd64
            artifact-path: apps/interweave/bin/interweave.exe

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps

      - name: Build WebView workspace dependencies
        run: pnpm exec turbo build --filter=@greypan/interweave-frontend^...

      - name: Build native artifact
        run: pnpm --filter @greypan/interweave run ${{ matrix.command }}

      - name: Upload verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
