name: Verify Wails Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wails-verify.yml'
      - '.mise.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'apps/wails-starter/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate Wails metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install Node
        run: mise install node

      - name: Validate Wails version metadata
        run: node apps/wails-starter/scripts/sync-version.mjs --check

  build:
    name: ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 DMG
            runner: macos-14
            command: build:macos
            artifact-name: wails-starter-macos-arm64
            artifact-path: apps/wails-starter/bin/wails-starter.dmg
          - name: Windows x64 EXE
            runner: windows-latest
            command: build:windows
            artifact-name: wails-starter-windows-amd64
            artifact-path: apps/wails-starter/bin/wails-starter.exe

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - id: pnpm-store
        name: Resolve pnpm store path
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set official registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebView workspace dependencies
        run: pnpm exec turbo build --filter=@greypan/wails-starter-frontend^...

      - name: Build native artifact
        run: pnpm --filter @greypan/wails-starter run ${{ matrix.command }}

      - name: Upload verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
