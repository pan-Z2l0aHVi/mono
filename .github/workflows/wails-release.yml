name: Release Wails Desktop

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - 'apps/interweave/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect desktop application release
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.release.outputs.should-release }}
      merge-sha: ${{ steps.release.outputs.merge-sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - name: Validate Wails version metadata
        run: node apps/interweave/scripts/sync-version.mjs --check

      - name: Validate shared build tasks are host-neutral
        run: node apps/interweave/scripts/check-build-tasks.mjs

      - id: release
        name: Detect a new desktop version
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          base_sha="$(git rev-parse "${MERGE_SHA}^1")"
          echo "merge-sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          version="$(node .github/scripts/read-json-version.mjs ./apps/interweave/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous_version="$(git show "$base_sha:apps/interweave/package.json" | node .github/scripts/read-json-version.mjs)"
          if [[ "$version" == "$previous_version" ]]; then
            echo 'should-release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "interweave-v$version" >/dev/null 2>&1; then
            echo 'should-release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should-release=true' >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 DMG
            runner: macos-14
            command: build:macos
            artifact-name: interweave-macos-arm64
            artifact-path: apps/interweave/bin/interweave.dmg
          - name: Windows x64 EXE
            runner: windows-latest
            command: build:windows
            artifact-name: interweave-windows-amd64
            artifact-path: apps/interweave/bin/interweave.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.merge-sha }}

      - uses: ./.github/actions/setup-deps

      - name: Build WebView workspace dependencies
        run: pnpm exec turbo build --filter=@greypan/interweave-frontend^...

      - name: Build native artifact
        run: pnpm --filter @greypan/interweave run ${{ matrix.command }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish desktop release
    needs: [prepare, build]
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.merge-sha }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: interweave-macos-arm64
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: interweave-windows-amd64
          path: release-assets/windows

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p release-assets/publish
          cp release-assets/macos/interweave.dmg "release-assets/publish/interweave-${VERSION}-macos-arm64.dmg"
          cp release-assets/windows/interweave.exe "release-assets/publish/interweave-${VERSION}-windows-x64.exe"
          cd release-assets/publish
          shasum -a 256 interweave-* > checksums.txt

      - name: Create annotated tag
        env:
          MERGE_SHA: ${{ needs.prepare.outputs.merge-sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tag="interweave-v${VERSION}"

          # gh release create 默认建 lightweight tag。显式建 annotated tag 并推上去，
          # 再让 gh 复用它（--verify-tag 要求 tag 已存在于远端，本地 tag 不算）。
          # 上一轮可能已推 tag 但 Release 建失败（prepare 的 gh release view 只看
          # Release，不存在则重跑），所以先查远端。annotated tag 的 ^{} 会剥到 commit，
          # lightweight tag 没有 ^{} 条目——两种形态都要判，且都不改写已发布的 tag。
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)"
          if [ -n "$existing" ]; then
            peeled="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | cut -f1)"
            if [ -n "$peeled" ] && [ "$peeled" = "$MERGE_SHA" ]; then
              echo "${tag} already annotated at ${MERGE_SHA}; reusing it"
              exit 0
            fi
            if [ -z "$peeled" ] && [ "$existing" = "$MERGE_SHA" ]; then
              echo "::error::${tag} already exists as a lightweight tag at ${MERGE_SHA}"
              echo "::error::convert it by hand (git tag -a -f) or delete it; this step will not rewrite it"
              exit 1
            fi
            echo "::error::${tag} already exists and does not point at ${MERGE_SHA}; refusing to rewrite it"
            exit 1
          fi

          # git 会从 runner 的 OS 账号自动推出 tagger（形如 runner@fv-az-...），
          # 命令照样成功，但那个身份逐次不同；固定成 bot 让 tag 的作者稳定可读。
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "Interweave v${VERSION}" "$MERGE_SHA"
          git push origin "refs/tags/${tag}:refs/tags/${tag}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge-sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh release create "interweave-v${VERSION}" \
            --target "$MERGE_SHA" \
            --verify-tag \
            --title "Interweave v${VERSION}" \
            --generate-notes \
            --notes 'The macOS and Windows artifacts are not yet signed for public distribution.' \
            release-assets/publish/*
