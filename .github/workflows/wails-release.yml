name: Release Wails Desktop

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - 'apps/wails-starter/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect desktop application release
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.release.outputs.should-release }}
      merge-sha: ${{ steps.release.outputs.merge-sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install Node
        run: mise install node

      - name: Validate Wails version metadata
        run: node apps/wails-starter/scripts/sync-version.mjs --check

      - id: release
        name: Detect a new desktop version
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          base_sha="$(git rev-parse "${MERGE_SHA}^1")"
          echo "merge-sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          version="$(node --input-type=module -e "import manifest from './apps/wails-starter/package.json' with { type: 'json' }; console.log(manifest.version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous_version="$(git show "$base_sha:apps/wails-starter/package.json" | node --input-type=module -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version))")"
          if [[ "$version" == "$previous_version" ]]; then
            echo 'should-release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "wails-starter-v$version" >/dev/null 2>&1; then
            echo 'should-release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'should-release=true' >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 DMG
            runner: macos-14
            command: build:macos
            artifact-name: wails-starter-macos-arm64
            artifact-path: apps/wails-starter/bin/wails-starter.dmg
          - name: Windows x64 EXE
            runner: windows-latest
            command: build:windows
            artifact-name: wails-starter-windows-amd64
            artifact-path: apps/wails-starter/bin/wails-starter.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.merge-sha }}

      - uses: jdx/mise-action@v4

      - id: pnpm-store
        name: Resolve pnpm store path
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set official registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebView workspace dependencies
        run: pnpm exec turbo build --filter=@greypan/wails-starter-frontend^...

      - name: Build native artifact
        run: pnpm --filter @greypan/wails-starter run ${{ matrix.command }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish desktop release
    needs: [prepare, build]
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.merge-sha }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: wails-starter-macos-arm64
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: wails-starter-windows-amd64
          path: release-assets/windows

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p release-assets/publish
          cp release-assets/macos/wails-starter.dmg "release-assets/publish/wails-starter-${VERSION}-macos-arm64.dmg"
          cp release-assets/windows/wails-starter.exe "release-assets/publish/wails-starter-${VERSION}-windows-x64.exe"
          cd release-assets/publish
          shasum -a 256 wails-starter-* > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge-sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          gh release create "wails-starter-v${VERSION}" \
            --target "$MERGE_SHA" \
            --title "Wails Starter v${VERSION}" \
            --generate-notes \
            --notes 'The macOS and Windows artifacts are not yet signed for public distribution.' \
            release-assets/publish/*
