name: CI

# main push（环境/依赖/Go 路径变动）、每 4 天 schedule 与 workflow_dispatch(warm_only=true) 预热默认分支基线缓存；
# pull_request 直接进入 check 验证 GitHub 生成的合并对象，标题更新也触发检查。
# strict 只要求 PR 分支跟上 base；squash 会创建新提交，不能据此断言合并提交与先前测试对象完全相同。
# trunk 全量复检走 workflow_dispatch（默认 warm_only=false）。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - '.mise.toml'
      - 'pnpm-lock.yaml'
      - 'apps/interweave/go.mod'
      - 'apps/interweave/go.sum'
      - 'apps/interweave/**/*.go'
      - '.github/actions/setup-deps/action.yml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 4 */4 * *'
  workflow_dispatch:
    inputs:
      warm_only:
        description: 'Only warm main baseline caches without running full check'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  warm-ci-caches:
    name: Warm CI baseline caches
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.warm_only) }}
    # Historical cold installs took up to 26.9 minutes in setup-deps; leave room to seed the default-branch cache.
    timeout-minutes: 35

    steps:
      - name: Require main ref for warm_only dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.warm_only && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "warm_only dispatch must run on refs/heads/main (got ${GITHUB_REF})" >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          wails: 'true'
          go-cache: 'true'

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      # apps/interweave/main.go:28 含 `//go:embed all:frontend/dist`；无 dist 时 go vet 必败并阻断 post-save。
      # 仅用临时点文件占位并经 trap 在同一步清理，预热 GOMODCACHE 与非 -race GOCACHE。
      - name: Warm Go module and build caches
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf apps/interweave/frontend/dist' EXIT
          mkdir -p apps/interweave/frontend/dist
          touch apps/interweave/frontend/dist/.keep
          pnpm --filter @greypan/interweave exec go vet ./...

  check:
    runs-on: ubuntu-latest
    # On pushes, schedules, and warm_only dispatches only warm the default-branch cache. For PRs and full dispatches, run check directly.
    if: ${{ github.event_name != 'push' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.warm_only) && !cancelled() }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read PR title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")
          base_sha=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$title" ]; then
            pull_number=${GITHUB_REF#refs/pull/}
            pull_number=${pull_number%/merge}
            if [[ ! "$pull_number" =~ ^[0-9]+$ ]]; then
              echo "Cannot determine pull request number from $GITHUB_REF" >&2
              exit 1
            fi
            title=$(gh api --jq .title "repos/$GITHUB_REPOSITORY/pulls/$pull_number")
          fi
          if [ -z "$base_sha" ]; then
            pull_number=${GITHUB_REF#refs/pull/}
            pull_number=${pull_number%/merge}
            if [[ ! "$pull_number" =~ ^[0-9]+$ ]]; then
              echo "Cannot determine pull request number from $GITHUB_REF" >&2
              exit 1
            fi
            base_sha=$(gh api --jq .base.sha "repos/$GITHUB_REPOSITORY/pulls/$pull_number")
          fi
          printf '%s' "$title" > "$RUNNER_TEMP/pr-title"
          printf '%s' "$base_sha" > "$RUNNER_TEMP/pr-base-sha"

      - name: Prepare base PR title rule
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_sha=$(cat "$RUNNER_TEMP/pr-base-sha")
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40,64}$ ]]; then
            echo "Cannot determine a valid PR base SHA" >&2
            exit 1
          fi
          git cat-file -e "$base_sha^{commit}"
          git show "$base_sha:commitlint.config.js" > "$RUNNER_TEMP/commitlint.config.mjs"
          if git cat-file -e "$base_sha:.github/scripts/check-pr-title.mjs" 2>/dev/null; then
            git show "$base_sha:.github/scripts/check-pr-title.mjs" > "$RUNNER_TEMP/check-pr-title.mjs"
          else
            cp .github/scripts/check-pr-title.mjs "$RUNNER_TEMP/check-pr-title.mjs"
          fi

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE_PATH: ${{ runner.temp }}/pr-title
          COMMITLINT_CONFIG_PATH: ${{ runner.temp }}/commitlint.config.mjs
        run: node "$RUNNER_TEMP/check-pr-title.mjs"

      - name: Record tested PR snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          checkout_sha=$(git rev-parse HEAD)
          {
            echo "## Tested PR snapshot"
            echo "- PR base SHA: ${{ github.event.pull_request.base.sha }}"
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "- Event SHA: $GITHUB_SHA"
            echo "- Checkout SHA: $checkout_sha"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-deps
        with:
          wails: 'true'
          go-cache: 'true'

      # interweave-frontend 的 build 依赖 wails3，每次 CI 显式验证工具链，
      # 避免 turbo 缓存命中时绕过 wails3 缺失/损坏而静默通过。
      - name: Verify Wails CLI
        run: bash .github/scripts/verify-wails.sh

      # 生成物新鲜度在 Build 之前只判不改地校验：Build 里 md-to-meta 插件的 writeArtifacts 会把
      # 失步的 src/generated/** 原地写新（healing），挂在测试档的 checkArtifacts 到那时永远空转。
      - name: Check generated artifacts
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm exec turbo run check-generated --filter=@greypan/react-web-ui-demo --filter=@greypan/vue-web-ui-demo --filter=@greypan/dev-kit-demo

      # 跨 app 的生成物 parity 同样抢在 Build 前：判据在根任务 //#check-generated-parity，
      # 只用 Node 内置模块，不依赖任何 workspace 产物（门禁 dist 那时还不存在）。
      - name: Check generated parity
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm exec turbo run check-generated-parity

      # 门禁实现住在 @greypan/monorepo-kit 的 dist 里：context/policy/changeset/pack 都消费构建产物，
      # 干净 runner 上必须先构建，否则门禁读到的是不存在的入口。
      - name: Build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm exec turbo run build --filter=!@greypan/interweave

      - name: Check shared agent context
        run: pnpm run check-context

      # 纳入唯一 required context；check-policy 先校验 fullCheckout，随后逐项独立运行各 policy 并默认收集全部失败（传 --fail-fast 可首错即停），任一 Err 使 job 失败。
      - name: Check repository policies
        shell: bash
        run: |
          pnpm run check-policy

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm run check-changeset --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Test repository Agent tools
        run: pnpm run test-scripts

      - name: Check published package contracts
        run: pnpm run check-pack

      # cspell 结果缓存按内容键判失效，同 SHA 精确命中、旧 SHA 前缀回退；PR 重复 run 复用，
      # 缓存隔离模型下新 PR 首跑自建。
      - name: Cache cspell results
        uses: actions/cache@v5
        with:
          path: .cspellcache
          key: ${{ runner.os }}-cspell-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cspell-

      - name: Format + Lint + Type-check + Go vet
        run: pnpm run check-code

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        # runner 核数少于本地时，turbo 默认的任务并发会让多个包的浏览器与 Go 测试互相抢占 CPU，
        # 表现为随机的等待预算耗尽。只在 CI 收敛任务并发，本地 `pnpm run test` 保持默认。
        run: pnpm exec turbo test --concurrency=2

  # Codex 审查 job 全部只读：模型在这里跑，写回（评论、推 patch）只在 codex-review-report.yml 发生。
  # 两条 job 分开是因为 ci.yml 的 permissions 不变量要求 PR 验证不持有任何写权限。
  codex-review:
    name: Codex review
    needs: check
    # 审查 job 保留版本分支排除；codex-gate 的判据自 2026-11-23 起分道（见其 if 注释）。
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main' }}
    # 模型步骤自己带 continue-on-error；job 级不再吞掉预检、落结论与上传的失败。
    # 审查 job 已切换为 Node 直调 API 两段式引擎（无 openai/codex-action / drop-sudo），
    # 不受 openai/codex-action#188 影响，恢复使用 ubuntu-latest；仅 codex-autofix-plan 仍固定 24.04。
    runs-on: ubuntu-latest
    # 直调两段式引擎实测常规与 60+ 文件大 PR 均在 1–4 分钟内完成；20 分钟兜住最坏重试路径并防网络僵死占队。
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      CODEX_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CODEX_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          # 模型读的是 head 快照；fetch-depth 0 让 merge-base 无需再向远端补对象。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - uses: ./.github/actions/stage-codex-inputs
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Prepare review range
        id: prepare
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prepare

      # 密钥只在 preflight 与直调步骤的 step 级 env 出现，绝不下放 job 级 env。
      # 四项配置与 codex 版本全部由 GitHub 后台提供，CI 定义里不留任何默认值或兜底表达式；
      # 可选 CODEX_REVIEW_EXTRA_HEADERS 仅以哈希参与指纹（不落明文到配置快照），留给受限网关自定义请求头。
      - name: Validate Codex configuration
        id: config
        env:
          CODEX_REVIEW_API_KEY: ${{ secrets.CODEX_REVIEW_API_KEY }}
          CODEX_RESPONSES_ENDPOINT: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
          CODEX_REVIEW_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
          CODEX_REVIEW_EXTRA_HEADERS: ${{ secrets.CODEX_REVIEW_EXTRA_HEADERS }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" preflight

      - name: Find reusable conclusion
        id: prior
        if: steps.config.outputs.configured == 'true'
        # 复用只为省一次模型调用；查询失败就该照常跑模型，不能拖垮审查本身。
        continue-on-error: true
        env:
          # gh 只读 GH_TOKEN/GH_HOST，runner 不会替步骤注入 GITHUB_TOKEN；github 上下文在 step 级 env 可用。
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prior-run

      - name: Download prior conclusion
        if: steps.prior.outputs.prior_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: codex-review-findings
          # 复用的是另一个 run 的 artifact，v7 必须显式给 token 才会用 run-id。
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior.outputs.prior_run_id }}
          repository: ${{ github.repository }}
          # 上一轮 artifact 必须解到独立目录：它带着上一轮的 review-scope.json，
          # 与本次 prepare 写的同名文件同目录会覆盖本次范围。
          path: ${{ runner.temp }}/codex-review-prior

      - name: Reuse prior conclusion
        id: reuse
        if: steps.config.outputs.configured == 'true'
        env:
          CODEX_REVIEW_PRIOR_RUN_ID: ${{ steps.prior.outputs.prior_run_id }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" reuse

      - name: Prepare incremental review
        id: incremental
        if: steps.config.outputs.configured == 'true' && steps.reuse.outputs.reused != 'true' && steps.prior.outputs.prior_head_sha != ''
        env:
          CODEX_REVIEW_PRIOR_HEAD_SHA: ${{ steps.prior.outputs.prior_head_sha }}
          CODEX_REVIEW_PRIOR_RUN_ID: ${{ steps.prior.outputs.prior_run_id }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prepare-incremental

      - name: Review pull request with Codex
        id: review
        if: steps.config.outputs.configured == 'true' && steps.reuse.outputs.reused != 'true' && steps.incremental.outputs.reused != 'true'
        # continue-on-error 只让 validate 有机会落结论；outcome 仍是 failure，由 validate 判成 error 并让 gate 变红。
        continue-on-error: true
        env:
          CODEX_REVIEW_API_KEY: ${{ secrets.CODEX_REVIEW_API_KEY }}
          CODEX_RESPONSES_ENDPOINT: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
          CODEX_REVIEW_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT }}
          CODEX_REVIEW_EXTRA_HEADERS: ${{ secrets.CODEX_REVIEW_EXTRA_HEADERS }}
          CODEX_REVIEW_MERGE_BASE_SHA: ${{ steps.prepare.outputs.merge_base_sha }}
          CODEX_REVIEW_START_SHA: ${{ steps.incremental.outputs.review_start_sha }}
          CODEX_REVIEW_PRIOR_DIR: ${{ runner.temp }}/codex-review-prior
          CODEX_REVIEW_DIFF_PATH: ${{ runner.temp }}/pr.diff
          CODEX_REVIEW_OUTPUT_PATH: ${{ runner.temp }}/codex-final-message.json
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" run

      - name: Record review conclusion
        if: always()
        env:
          CODEX_REVIEW_STEP_OUTCOME: ${{ steps.review.outcome }}
          CODEX_REVIEW_PRIOR_RUN_ID: ${{ steps.prior.outputs.prior_run_id }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" validate

      - name: Upload review findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codex-review-findings
          path: ${{ runner.temp }}/codex-review
          # --failed 重跑审查 job 时会在同一 run 内再传一次同名产物，不覆盖会撞 409。
          overwrite: true

      # 模型可能在打开任何改动文件之前就交出 schema 允许的空对象（findings 与 inspected 全空）。
      # 那时 run_codex 与 validate 都是 success，只有 gate 判红，--failed 就只会重跑 gate、
      # 拿同一份空壳 artifact 再红一次。这一步让审查 job 一起变红，好让 --failed 重跑模型 job。
      # 脚本从工作区（PR head）读取，改动提出它的 PR 上即生效；它只判红、不判绿，结论仍由
      # 取自 PR base 的 trusted validate / gate 裁决，作者改它换不来绿色。
      # pull_request 的 workflow YAML 取自 merge ref（base + head），本改动合入 main 后，
      # 尚未更新的 open PR 也会拿到这一步，但它们的 head 里没有该脚本：hashFiles 为空时跳过，
      # 不把「分支落后」误判成模型 job 故障；旧 head 本就处于新防线未生效的自举期。
      - name: Reject empty review output
        if: ${{ always() && steps.config.outputs.configured == 'true' && steps.reuse.outputs.reused != 'true' && steps.incremental.outputs.reused != 'true' && hashFiles('.github/scripts/check-review-output.mjs') != '' }}
        env:
          CODEX_REVIEW_OUTPUT_PATH: ${{ runner.temp }}/codex-final-message.json
          CODEX_REVIEW_SCOPE_PATH: ${{ runner.temp }}/codex-review/review-scope.json
        run: node .github/scripts/check-review-output.mjs

  codex-gate:
    name: Codex review gate
    needs: [check, codex-review]
    # 门禁只判已有结论，不跑模型；check 或 review 谁失败都不该让它缺席。
    # gate 是 required check（ruleset main protection），自 2026-11-23 起不再排除任何 PR：
    # GitHub 会为被 if 跳过的 job 上报 skipped check run，而 required 把 skipped 计为通过——
    # 任何排除都是 fail-open。fork 与版本分支因此都在 gate 覆盖内：fork 的 review skip 经
    # 收窄后的 not_applicable 出口判 error 红，版本分支（同仓）走内建 not_applicable 绿退出。
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          # 本地 action 从 job 的工作区解析，检出 base 会让它找不到自己；
          # 固定的是脚本内容的来源（下一步从 base 的对象里读出），工作区仍由 head 提供。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - uses: ./.github/actions/stage-codex-inputs
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Download review findings
        # review job 被跳过时没有 artifact，那是 not_applicable，不是门禁故障。
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: codex-review-findings
          path: ${{ runner.temp }}/codex-review

      - name: Apply review gate
        env:
          # 判定要读 live PR head，所以这一步必须有凭据：runner 不会替步骤注入 GITHUB_TOKEN，gh 只认 GH_TOKEN。
          GH_TOKEN: ${{ github.token }}
          # not_applicable 只对同仓 PR 成立，且只认两种合法 skip：版本分支（review 按设计不跑），
          # 以及 check 未成功（review 的 needs 不满足；合并已由红的 required check 拦住）。
          # 同仓条件是整条表达式的前提：fork 的 review 必然 skip，若不先排除 fork，只要 check 未成功
          # 就连 fork 也拿到绿 gate——skipped 的 required check 会被 GitHub 计为通过，那正是 fail-open。
          CODEX_REVIEW_NOT_APPLICABLE: ${{ needs.codex-review.result == 'skipped' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'changeset-release/main' || needs.check.result != 'success') }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" gate

  codex-autofix-plan:
    name: Codex autofix plan
    needs: check
    # job 级 if 不含状态检查函数时 GitHub 会隐式附加 success()，而本 job 恰恰要在 check 失败时跑：
    # needs.check.result == 'failure' 会在依赖失败时被直接短路成 skipped，字面条件根本不求值。
    # !cancelled() 既绕过隐式 success()，又不会在 run 被取消时白白启动模型 job；与 codex-review 同款前缀。
    if: ${{ !cancelled() && needs.check.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main' && vars.CODEX_AUTOFIX_ENABLED == 'true' }}
    continue-on-error: true
    # 与审查 job 同一镜像约束：autofix 用 workspace-write + drop-sudo，同样会撞上 #188。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      CODEX_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CODEX_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CODEX_AUTOFIX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - uses: ./.github/actions/stage-codex-inputs
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Prepare review range
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prepare

      - name: Validate Codex configuration
        id: config
        env:
          CODEX_REVIEW_API_KEY: ${{ secrets.CODEX_REVIEW_API_KEY }}
          CODEX_RESPONSES_ENDPOINT: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
          CODEX_REVIEW_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" preflight

      - name: Capture failing CI log
        id: failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-autofix.mjs" prepare

      - name: Propose autofix patch with Codex
        if: steps.config.outputs.configured == 'true' && steps.failure.outputs.has_log == 'true'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        env:
          # autofix prompt 的两个输入路径，同样只能在 step 级引用 runner 上下文。
          CODEX_AUTOFIX_LOG_PATH: ${{ runner.temp }}/ci-failure.log
          CODEX_REVIEW_DIFF_PATH: ${{ runner.temp }}/pr.diff
        with:
          openai-api-key: ${{ secrets.CODEX_REVIEW_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          codex-version: ${{ vars.CODEX_VERSION }}
          sandbox: 'workspace-write'
          safety-strategy: 'drop-sudo'
          model: ${{ vars.CODEX_REVIEW_MODEL }}
          effort: ${{ vars.CODEX_REVIEW_EFFORT }}
          prompt-file: ${{ runner.temp }}/trusted/codex/prompts/autofix.md
          output-file: ${{ runner.temp }}/codex-autofix-message.txt

      - name: Capture autofix patch
        if: always()
        id: patch
        # deny list 从 base 落地的副本读；runner 上下文只能在 step 级 env 用，job 级会让整个文件 invalid。
        env:
          CODEX_TRUSTED_SETTINGS: ${{ runner.temp }}/trusted/.claude/settings.json
          # 只有 `Check changesets` 失败时才放行新增 `.changeset/*.md`；其余失败仍只许改已入库文件。
          CODEX_AUTOFIX_FAILED_STEPS: ${{ steps.failure.outputs.failed_steps }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-autofix.mjs" capture

      - name: Upload autofix patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-autofix-patch
          path: ${{ runner.temp }}/autofix.patch
