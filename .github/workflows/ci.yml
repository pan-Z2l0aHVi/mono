name: CI

# main push 只预热 Wails apt 缓存；pull_request 验证 GitHub 生成的合并对象，标题更新也触发检查。
# strict 只要求 PR 分支跟上 base；squash 会创建新提交，不能据此断言合并提交与先前测试对象完全相同。
# trunk 全量复检走 workflow_dispatch。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  prepare-wails-apt-cache:
    name: Prepare Wails apt cache
    runs-on: ubuntu-latest
    # Historical cold installs took up to 26.9 minutes in setup-deps; leave room to seed the PR cache.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          skip-mise: 'true'
          skip-install: 'true'
          wails: 'true'
          wails-download-only: 'true'

  check:
    runs-on: ubuntu-latest
    needs: prepare-wails-apt-cache
    # On pushes only warm the default-branch cache. For PRs, continue after preparation failure but honor cancellation.
    if: ${{ github.event_name != 'push' && !cancelled() }}
    timeout-minutes: 15
    env:
      # CI 显式把 artifact cache 放在 workspace 内，供 actions/cache 保存与恢复；mise 保留此覆盖。
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read PR title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")
          base_sha=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$title" ]; then
            pull_number=${GITHUB_REF#refs/pull/}
            pull_number=${pull_number%/merge}
            if [[ ! "$pull_number" =~ ^[0-9]+$ ]]; then
              echo "Cannot determine pull request number from $GITHUB_REF" >&2
              exit 1
            fi
            title=$(gh api --jq .title "repos/$GITHUB_REPOSITORY/pulls/$pull_number")
          fi
          if [ -z "$base_sha" ]; then
            pull_number=${GITHUB_REF#refs/pull/}
            pull_number=${pull_number%/merge}
            if [[ ! "$pull_number" =~ ^[0-9]+$ ]]; then
              echo "Cannot determine pull request number from $GITHUB_REF" >&2
              exit 1
            fi
            base_sha=$(gh api --jq .base.sha "repos/$GITHUB_REPOSITORY/pulls/$pull_number")
          fi
          printf '%s' "$title" > "$RUNNER_TEMP/pr-title"
          printf '%s' "$base_sha" > "$RUNNER_TEMP/pr-base-sha"

      - name: Prepare base PR title rule
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_sha=$(cat "$RUNNER_TEMP/pr-base-sha")
          if [[ ! "$base_sha" =~ ^[[:xdigit:]]{40,64}$ ]]; then
            echo "Cannot determine a valid PR base SHA" >&2
            exit 1
          fi
          git cat-file -e "$base_sha^{commit}"
          git show "$base_sha:commitlint.config.js" > "$RUNNER_TEMP/commitlint.config.mjs"
          if git cat-file -e "$base_sha:.github/scripts/check-pr-title.mjs" 2>/dev/null; then
            git show "$base_sha:.github/scripts/check-pr-title.mjs" > "$RUNNER_TEMP/check-pr-title.mjs"
          else
            cp .github/scripts/check-pr-title.mjs "$RUNNER_TEMP/check-pr-title.mjs"
          fi

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE_PATH: ${{ runner.temp }}/pr-title
          COMMITLINT_CONFIG_PATH: ${{ runner.temp }}/commitlint.config.mjs
        run: node "$RUNNER_TEMP/check-pr-title.mjs"

      - name: Record tested PR snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          checkout_sha=$(git rev-parse HEAD)
          {
            echo "## Tested PR snapshot"
            echo "- PR base SHA: ${{ github.event.pull_request.base.sha }}"
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "- Event SHA: $GITHUB_SHA"
            echo "- Checkout SHA: $checkout_sha"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-deps
        with:
          wails: 'true'
          go-cache: 'true'

      # interweave-frontend 的 build 依赖 wails3，每次 CI 显式验证工具链，
      # 避免 turbo 缓存命中时绕过 wails3 缺失/损坏而静默通过。
      - name: Verify Wails CLI
        run: bash .github/scripts/verify-wails.sh

      # 按 SHA 保存新构建的 Turbo artifacts；restore-keys 仍允许复用最近的 cache。
      # 只按 lockfile 做主 key 会在代码变化时命中旧 key，导致 post 阶段跳过保存。
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('.mise.toml') }}-

      # 生成物新鲜度在 Build 之前只判不改地校验：Build 里 md-to-meta 插件的 writeArtifacts 会把
      # 失步的 src/generated/** 原地写新（healing），挂在测试档的 checkArtifacts 到那时永远空转。
      - name: Check generated artifacts
        run: pnpm exec turbo run check-generated --filter=@greypan/react-web-ui-demo --filter=@greypan/vue-web-ui-demo

      # 门禁实现住在 @greypan/monorepo-kit 的 dist 里：context/policy/changeset/pack 都消费构建产物，
      # 干净 runner 上必须先构建，否则门禁读到的是不存在的入口。
      - name: Build
        run: pnpm exec turbo run build --filter=!@greypan/interweave

      - name: Check shared agent context
        run: pnpm run check-context

      # 纳入唯一 required context；check-policy 内部并发运行各 policy check，任一失败都会使 job 失败。
      - name: Check repository policies
        shell: bash
        run: |
          pnpm run check-policy

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm run check-changeset --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Test repository Agent tools
        run: pnpm run test-scripts

      - name: Check published package contracts
        run: pnpm run check-pack

      # cspell 结果缓存按内容键判失效，同 SHA 精确命中、旧 SHA 前缀回退；PR 重复 run 复用，
      # 缓存隔离模型下新 PR 首跑自建。
      - name: Cache cspell results
        uses: actions/cache@v5
        with:
          path: .cspellcache
          key: ${{ runner.os }}-cspell-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cspell-

      - name: Format + Lint + Type-check + Go vet
        run: pnpm run check-code

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Test
        # runner 核数少于本地时，turbo 默认的任务并发会让多个包的浏览器与 Go 测试互相抢占 CPU，
        # 表现为随机的等待预算耗尽。只在 CI 收敛任务并发，本地 `pnpm run test` 保持默认。
        run: pnpm exec turbo test --concurrency=2

  # Codex 审查腿全部只读：模型在这里跑，写回（评论、推 patch）只在 codex-review-publish.yml 发生。
  # 两条腿分开是因为 ci.yml 的 permissions 不变量要求 PR 验证不持有任何写权限。
  codex-review:
    name: Codex review
    needs: check
    # 资格判据与 codex-gate 必须逐字一致；fork PR 拿不到仓库 secret，版本分支由发布流程自审。
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main' }}
    # 模型步骤自己带 continue-on-error；job 级不再吞掉预检、落结论与上传的失败。
    # 首次落地时 base 的可信脚本还没有 preflight 子命令，这一步的红叉是唯一能暴露 bootstrap 的信号。
    runs-on: ubuntu-latest
    # 60 分钟是首批实测的临时余量，测出真实分布后回收；判定口径见 docs/adr/0021-codex-review-gate.md。
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      CODEX_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CODEX_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          # 模型读的是 head 快照；fetch-depth 0 让 merge-base 无需再向远端补对象。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - uses: ./.github/actions/stage-codex-inputs
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Prepare review range
        id: prepare
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prepare

      # 密钥只在 preflight 这一步落到 env：job 级 env 会把密钥带进模型进程，ADR 的代理隔离就不成立。
      # 四项配置与 codex 版本全部由 GitHub 后台提供，CI 定义里不留任何默认值或兜底表达式。
      - name: Validate Codex configuration
        id: config
        env:
          CODEX_REVIEW_API_KEY: ${{ secrets.CODEX_REVIEW_API_KEY }}
          CODEX_RESPONSES_ENDPOINT: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
          CODEX_REVIEW_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" preflight

      - name: Find reusable conclusion
        id: prior
        if: steps.config.outputs.configured == 'true'
        # 复用只为省一次模型调用；查询失败就该照常跑模型，不能拖垮审查本身。
        continue-on-error: true
        env:
          # gh 只读 GH_TOKEN/GH_HOST，runner 不会替步骤注入 GITHUB_TOKEN；github 上下文在 step 级 env 可用。
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prior-run

      - name: Download prior conclusion
        if: steps.prior.outputs.prior_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: codex-review-findings
          run-id: ${{ steps.prior.outputs.prior_run_id }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/codex-review

      - name: Reuse prior conclusion
        id: reuse
        if: steps.config.outputs.configured == 'true'
        env:
          CODEX_REVIEW_PRIOR_RUN_ID: ${{ steps.prior.outputs.prior_run_id }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" reuse

      - name: Review pull request with Codex
        id: review
        if: steps.config.outputs.configured == 'true' && steps.reuse.outputs.reused != 'true'
        # continue-on-error 只让 validate 有机会落结论；outcome 仍是 failure，由 validate 判成 error 并让 gate 变红。
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        env:
          CODEX_REVIEW_MERGE_BASE_SHA: ${{ steps.prepare.outputs.merge_base_sha }}
          # prompt 把 diff 路径交给模型；runner 上下文只能在 step 级 env 出现，job 级会让整个文件 invalid。
          CODEX_REVIEW_DIFF_PATH: ${{ runner.temp }}/pr.diff
        with:
          openai-api-key: ${{ secrets.CODEX_REVIEW_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          codex-version: ${{ vars.CODEX_VERSION }}
          # 用 legacy sandbox 而不是 permission-profile：本仓 .codex/config.toml 在 project 层写死
          # sandbox_mode = "danger-full-access"，--sandbox 覆盖的是同一个键，default_permissions 不是。
          sandbox: 'read-only'
          safety-strategy: 'drop-sudo'
          model: ${{ vars.CODEX_REVIEW_MODEL }}
          effort: ${{ vars.CODEX_REVIEW_EFFORT }}
          prompt-file: ${{ runner.temp }}/trusted/codex/prompts/review.md
          output-schema-file: ${{ runner.temp }}/trusted/codex/schemas/review-findings.schema.json
          output-file: ${{ runner.temp }}/codex-final-message.json

      - name: Record review conclusion
        if: always()
        env:
          CODEX_REVIEW_STEP_OUTCOME: ${{ steps.review.outcome }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" validate

      - name: Upload review findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codex-review-findings
          path: ${{ runner.temp }}/codex-review

  codex-gate:
    name: Codex review gate
    needs: [check, codex-review]
    # 门禁只判已有结论，不跑模型；check 或 review 谁失败都不该让它缺席。
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          # 本地 action 从 job 的工作区解析，检出 base 会让它找不到自己；
          # 固定的是脚本内容的来源（下一步从 base 的对象里读出），工作区仍由 head 提供。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - uses: ./.github/actions/stage-codex-inputs
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Download review findings
        # review job 被跳过时没有 artifact，那是 unreviewed，不是门禁故障。
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: codex-review-findings
          path: ${{ runner.temp }}/codex-review

      - name: Apply review gate
        env:
          # 判定要读 live PR head，所以这一步必须有凭据：runner 不会替步骤注入 GITHUB_TOKEN，gh 只认 GH_TOKEN。
          GH_TOKEN: ${{ github.token }}
          # review job 被整体跳过（例如 check 失败）属于不适用，不是审查故障；其余缺产物一律 error 变红。
          CODEX_REVIEW_NOT_APPLICABLE: ${{ needs.codex-review.result == 'skipped' }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" gate

  codex-autofix-plan:
    name: Codex autofix plan
    needs: check
    if: ${{ needs.check.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main' && vars.CODEX_AUTOFIX_ENABLED == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      CODEX_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CODEX_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CODEX_AUTOFIX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node'
          skip-install: 'true'

      - uses: ./.github/actions/stage-codex-inputs
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Prepare review range
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" prepare

      - name: Validate Codex configuration
        id: config
        env:
          CODEX_REVIEW_API_KEY: ${{ secrets.CODEX_REVIEW_API_KEY }}
          CODEX_RESPONSES_ENDPOINT: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
          CODEX_REVIEW_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT }}
          CODEX_VERSION: ${{ vars.CODEX_VERSION }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-review.mjs" preflight

      - name: Capture failing CI log
        id: failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/scripts/codex-autofix.mjs" prepare

      - name: Propose autofix patch with Codex
        if: steps.config.outputs.configured == 'true' && steps.failure.outputs.has_log == 'true'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        env:
          # autofix prompt 的两个输入路径，同样只能在 step 级引用 runner 上下文。
          CODEX_AUTOFIX_LOG_PATH: ${{ runner.temp }}/ci-failure.log
          CODEX_REVIEW_DIFF_PATH: ${{ runner.temp }}/pr.diff
        with:
          openai-api-key: ${{ secrets.CODEX_REVIEW_API_KEY }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_ENDPOINT }}
          codex-version: ${{ vars.CODEX_VERSION }}
          sandbox: 'workspace-write'
          safety-strategy: 'drop-sudo'
          model: ${{ vars.CODEX_REVIEW_MODEL }}
          effort: ${{ vars.CODEX_REVIEW_EFFORT }}
          prompt-file: ${{ runner.temp }}/trusted/codex/prompts/autofix.md
          output-file: ${{ runner.temp }}/codex-autofix-message.txt

      - name: Capture autofix patch
        if: always()
        id: patch
        # deny list 从 base 落地的副本读；runner 上下文只能在 step 级 env 用，job 级会让整个文件 invalid。
        env:
          CODEX_TRUSTED_SETTINGS: ${{ runner.temp }}/trusted/.claude/settings.json
        run: node "$RUNNER_TEMP/trusted/scripts/codex-autofix.mjs" capture

      - name: Upload autofix patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: codex-autofix-patch
          path: ${{ runner.temp }}/autofix.patch
