name: CI

# 不监听 push：仓库是 squash-only 且 ruleset 开了 strict required status，PR head 的树就等于合并后
# main 的树，push 那次只是把同一份验证再跑一遍。trunk 按需复检走 workflow_dispatch。
# 触发面、job 依赖与安装面的单一声明在 .github/scripts/ci-topology.mjs，由 scripts/ci-topology.test.mjs
# 拿真实 YAML 逐字段比对。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # mise 配置会把 TURBO_CACHE_DIR 锚定到 git common dir（主仓与 worktree 共享缓存）；
      # CI 显式固定回 workspace 内，保证 actions/cache 的 .turbo 路径不被绕过。
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps
        with:
          wails: 'true'

      # interweave-frontend 的 build 依赖 wails3，每次 CI 显式验证工具链，
      # 避免 turbo 缓存命中时绕过 wails3 缺失/损坏而静默通过。
      - name: Verify Wails CLI
        run: bash .github/scripts/verify-wails.sh

      # 按 SHA 保存新构建的 Turbo artifacts；restore-keys 仍允许复用最近的 cache。
      # 只按 lockfile 做主 key 会在代码变化时命中旧 key，导致 post 阶段跳过保存。
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-go-${{ hashFiles('apps/interweave/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('apps/interweave/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Check shared agent context
        run: pnpm run validate:context

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Build
        run: pnpm run build

      - name: Test repository Agent tools
        run: pnpm run test:scripts

      - name: Check published package contracts
        run: pnpm run check:pack

      - name: Format + Lint + Type-check + Go vet
        run: pnpm run check:code

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Test
        id: test
        run: set -o pipefail && pnpm run test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      # flake 台账的埋点：失败时把 vitest 的 FAIL 行抽进 step summary，并把原始日志与机器可读清单作为
      # 保留 1 天的 artifact 上传。`set -o pipefail` 保证 tee 不会吞掉测试的退出码 —— 判据不变，这里只留痕。
      #
      # 守卫的两半都不可省。`failure()` 是入场券：GitHub 对不含 status check 函数的 `if` 仍然套默认
      # `success()`，所以只写 `steps.test.outcome` 时，这一步在它唯一可能成立的时刻（前一步刚失败）就已经被
      # 跳过 —— 实测 run 35800643887：Test 红、留痕两步 skipped、artifact 为空。`steps.test.outcome == 'failure'`
      # 是判据：裸 `failure()` 对「任意前序步骤红过」都成立，lint 失败会让 Test 被 skip、留痕两步却照样跑，
      # 台账里就多出一条没有测试日志的假记录 —— 而这份台账的唯一用途是回答「哪些测试在 flake」。
      # 恒假的那一半不会报错、也不会红，所以由 scripts/ci-topology.test.mjs 的 status-function 规则钉住；
      # 旧 attempt 的日志与 artifact 在 GitHub 侧事后拿不回，所以这份台账只能从现在开始有数据。
      - name: Record test failures
        if: failure() && steps.test.outcome == 'failure'
        run: node .github/scripts/record-test-failures.mjs "$RUNNER_TEMP/test-output.log" "$RUNNER_TEMP/test-failures.json"

      - name: Upload test output
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-output.log
            ${{ runner.temp }}/test-failures.json
          retention-days: 1
