name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node pnpm'
          wails: 'true'

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Check shared agent context
        run: pnpm run validate:context

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Build
        run: pnpm run build

      - name: Test repository Agent tools
        run: pnpm run test:scripts

      - name: Check published package contracts
        run: pnpm run check:pack

      - name: Format + Lint + Type-check
        run: pnpm run fix:code

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Test
        run: pnpm run test
