name: CI

# 不监听 push；pull_request 默认验证 GitHub 生成的合并对象。strict 只要求 PR 分支跟上 base，
# squash 会创建新提交，不能据此断言合并提交与先前测试对象完全相同。trunk 复检走 workflow_dispatch。
# 触发面、job 依赖与安装面的单一声明在 .github/scripts/ci-topology.mjs，由同目录的 ci-topology.test.mjs
# 拿真实 YAML 逐字段比对。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # mise 配置会把 TURBO_CACHE_DIR 锚定到 git common dir（主仓与 worktree 共享缓存）；
      # CI 显式固定回 workspace 内，保证 actions/cache 的 .turbo 路径不被绕过。
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record tested PR snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          checkout_sha=$(git rev-parse HEAD)
          {
            echo "## Tested PR snapshot"
            echo "- PR base SHA: ${{ github.event.pull_request.base.sha }}"
            echo "- PR head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "- Event SHA: $GITHUB_SHA"
            echo "- Checkout SHA: $checkout_sha"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-deps
        with:
          wails: 'true'

      # interweave-frontend 的 build 依赖 wails3，每次 CI 显式验证工具链，
      # 避免 turbo 缓存命中时绕过 wails3 缺失/损坏而静默通过。
      - name: Verify Wails CLI
        run: bash .github/scripts/verify-wails.sh

      # 按 SHA 保存新构建的 Turbo artifacts；restore-keys 仍允许复用最近的 cache。
      # 只按 lockfile 做主 key 会在代码变化时命中旧 key，导致 post 阶段跳过保存。
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-go-${{ hashFiles('apps/interweave/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('apps/interweave/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Check shared agent context
        run: pnpm run ci:validate-context

      # 纳入唯一 required context；显式 bash 使用 fail-fast，任一 policy check 失败都会使 job 失败。
      - name: Check repository policies
        shell: bash
        run: |
          .agents/checks/command-conventions
          .agents/checks/no-mutual-links
          .agents/checks/turbo-cache-invariant
          .agents/checks/web-ui-docs-inputs

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec changeset status --since="$PR_BASE_SHA"
          .agents/checks/changeset-required --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Build
        run: pnpm run build

      - name: Test repository Agent tools
        run: pnpm run ci:test-scripts

      - name: Check published package contracts
        run: pnpm run check-pack

      - name: Format + Lint + Type-check + Go vet
        run: pnpm run check-code

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Test
        run: pnpm run test
