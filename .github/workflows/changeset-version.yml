name: Create Version PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Create or update version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-version
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # This job only runs changeset status and a shell script; scoping the install
      # keeps it off the go toolchain and the wails3 build.
      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node pnpm'

      - id: changesets
        name: Detect pending Changesets
        shell: bash
        run: |
          pnpm exec changeset status --output="$RUNNER_TEMP/changeset-status.json"
          node .github/scripts/detect-pending-changesets.mjs "$RUNNER_TEMP/changeset-status.json"

      - name: Create or update version pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: sh apps/interweave/scripts/changeset-version.sh
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

      # No `gh workflow run` here on purpose: a version pull request is validated by the run
      # its own `pull_request` event triggers. Dispatching the same commit again raced that
      # run inside one concurrency group, which cancelled the dispatch only while it was still
      # in flight; otherwise the whole CI simply ran twice. If GitHub holds a version PR run
      # at `action_required`, approve it instead; the measured history and its limits live in
      # docs/agents/build.md「CI 门控与 workflow 拓扑」.
