name: Create Version PR

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  version:
    name: Create or update version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install Node and pnpm
        run: mise install node pnpm

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set official registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - id: changesets
        name: Detect pending Changesets
        shell: bash
        run: |
          pnpm exec changeset status --output="$RUNNER_TEMP/changeset-status.json"
          node --input-type=module - "$RUNNER_TEMP/changeset-status.json" <<'EOF'
          import { appendFile, readFile } from 'node:fs/promises'

          const status = JSON.parse(await readFile(process.argv[2], 'utf8'))
          const releases = status.releases ?? []
          const hasChangesets = releases.length > 0
          const hasWailsRelease = releases.some(release => release.name === '@greypan/interweave')

          await appendFile(process.env.GITHUB_OUTPUT, `has-changesets=${hasChangesets}\nhas-wails-release=${hasWailsRelease}\n`)
          EOF

      - name: Install Wails Linux prerequisites
        if: steps.changesets.outputs.has-wails-release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Go and Wails CLI
        if: steps.changesets.outputs.has-wails-release == 'true'
        run: mise install go 'go:github.com/wailsapp/wails/v3/cmd/wails3'

      - name: Create or update version pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run ci.yml --ref changeset-release/main

          if [[ "${{ steps.changesets.outputs.has-wails-release }}" == 'true' ]]; then
            gh workflow run wails-verify.yml --ref changeset-release/main
          fi
