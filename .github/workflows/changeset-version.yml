name: Create Version PR

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  version:
    name: Create or update version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps
        with:
          wails: 'true'

      - id: changesets
        name: Detect pending Changesets
        shell: bash
        run: |
          pnpm exec changeset status --output="$RUNNER_TEMP/changeset-status.json"
          node .github/scripts/detect-pending-changesets.mjs "$RUNNER_TEMP/changeset-status.json"

      - name: Create or update version pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run release:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

      - name: Validate version pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run ci.yml --ref changeset-release/main

          if [[ "${{ steps.changesets.outputs.has-wails-release }}" == 'true' ]]; then
            gh workflow run wails-verify.yml --ref changeset-release/main
          fi
