name: Publish npm Packages

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect public package release
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-publish: ${{ steps.release.outputs.should-publish }}
      merge-sha: ${{ steps.release.outputs.merge-sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - id: release
        name: Detect versioned public packages
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          base_sha="$(git rev-parse "${MERGE_SHA}^1")"
          echo "merge-sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          if git diff --name-only "$base_sha" "$MERGE_SHA" -- packages | grep -Eq '^packages/[^/]+/package\.json$'; then
            echo 'should-publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should-publish=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish npm packages
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.merge-sha }}

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install Node and pnpm
        run: mise install node pnpm

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set official registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm exec turbo build --filter='./packages/*'

      - name: Publish public npm packages
        run: pnpm changeset publish
