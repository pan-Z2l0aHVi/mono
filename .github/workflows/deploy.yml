name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy'
        type: choice
        required: true
        options:
          - react-web-ui-demo
          - vue-web-ui-demo
        default: vue-web-ui-demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set official registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build ${{ inputs.app }}
        run: pnpm --filter @greypan/${{ inputs.app }}... build

      - name: SPA fallback for client-side routing
        run: cp apps/${{ inputs.app }}/dist/index.html apps/${{ inputs.app }}/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/${{ inputs.app }}/dist

      - id: deployment
        uses: actions/deploy-pages@v4
