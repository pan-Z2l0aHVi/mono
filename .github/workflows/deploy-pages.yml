name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_APPS: react-web-ui-demo vue-web-ui-demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # Pages deployment only needs the JavaScript toolchain. Avoid compiling
      # Wails' platform-specific CLI on the Ubuntu deployment runner.
      - uses: ./.github/actions/setup-deps
        with:
          mise-install: 'node pnpm'

      - name: Build demo apps
        run: |
          for APP_DIR in $DEMO_APPS; do
            GITHUB_BASE_PATH="/mono/${APP_DIR}" pnpm --filter "{./apps/${APP_DIR}}..." build
          done

      - name: Prepare deployment directory
        run: |
          for APP_DIR in $DEMO_APPS; do
            mkdir -p "deploy/${APP_DIR}"
            cp -r "apps/${APP_DIR}/dist/." "deploy/${APP_DIR}/"
          done

          # GitHub Pages serves only the root 404 page for unknown nested paths.
          # Preserve the target route so each SPA can restore it after loading.
          cat > deploy/404.html <<EOF404
          <!doctype html>
          <script>
            var demoApps = new Set('${DEMO_APPS}'.split(' '))
            var segs = location.pathname.replace('/mono/', '').split('/')
            var appDir = segs[0]
            if (demoApps.has(appDir)) {
              var route = '/' + segs.slice(1).join('/') + location.search + location.hash
              location.replace('/mono/' + appDir + '/?redirect=' + encodeURIComponent(route))
            } else {
              document.title = '404'
              document.write('<h1>404</h1><p><a href="/mono/">Go home</a></p>')
            }
          </script>
          EOF404

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - id: deployment
        uses: actions/deploy-pages@v4
