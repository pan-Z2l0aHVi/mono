# 图标处理工具的 Python 工具链由 mise 显式管理。

# 刻意放在子目录而不是根 `.mise.toml`：mise 只加载 cwd 及其父目录的配置，
# 因此 CI（cwd 在仓库根，且 `setup-deps` 默认 `mise install` 全量安装根配置里的工具）
# 不会为这两个 docs 下的脚本下载 Python。
[tools]
python = "3.13"

# 依赖装进本目录的 .venv（已 gitignore），不污染任何全局 Python。
# 用法：cd docs/design/app-icons/tools && mise run deps
[tasks.deps]
description = "Create .venv and install numpy / Pillow / scipy for the icon tools"
run = """
python -m venv .venv
.venv/bin/python -m pip install --requirement requirements.txt
"""
