engineStrict: true

packages:
  - 'packages/**'

# Versions are pinned to what reproduced voidzero-dev/vite-plus#2697.
catalog:
  '@tsconfig/node24': ^24.0.4
  '@types/node': ^26.3.0
  remeda: ^2.44.0
  turbo: ^2.10.11
  typescript: ~6.0.3
  # vite-plus owns the vite implementation, so `vite` is an alias for its core package.
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vite-plugin-dts: ^5.0.3

catalogMode: prefer
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  core-js: false
  msw: set this to true or false
