<!doctype html>
<html lang="zh-CN" data-overlayscrollbars-initialize data-file-drop-target="window">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/interweave-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Interweave</title>
    <style>
      /*
       * 静态启动层：设置由 Go 拥有，首帧拿不到已持久化的外观。若这里不留一层不透明画面，
       * 窗口会先以默认主题渲染一帧（Windows 上是深色窗口底 + 白底页面），用户看到一次闪白。
       * 本层是纯 HTML/CSS，不依赖任何脚本或组件库：它在 WebView 拿到第一个字节时就能画出来。
       *
       * 配色取窗口背景色（application.NewRGB(6, 7, 15)）：它与窗口底色一致，
       * 因此启动层撤掉时背景不会跳变。
       */
      #startup-layer {
        position: fixed;
        z-index: 2147483647;
        inset: 0;

        display: grid;
        place-items: center;

        background: rgb(6 7 15);

        transition: opacity 220ms ease-out;
      }

      #startup-layer[data-leaving='true'] {
        pointer-events: none;
        opacity: 0;
      }

      #startup-layer img {
        width: 120px;
        height: 120px;
        border-radius: 26px;
        animation: startup-pulse 1600ms ease-in-out infinite;
      }

      @keyframes startup-pulse {
        0%,
        100% {
          opacity: 0.72;
        }

        50% {
          opacity: 1;
        }
      }

      /* 用户的减少动画偏好与本应用自己的设置一致：两者任一为真都不播放脉冲。 */
      @media (prefers-reduced-motion: reduce) {
        #startup-layer img {
          opacity: 1;
          animation: none;
        }
      }
    </style>
  </head>
  <body data-overlayscrollbars-initialize>
    <!--
      logo 复用应用图标（与 build/appicon.png 同源），不另画一份启动图。
      aria-hidden：它只是遮住首帧的过渡物，对读屏用户没有意义，读屏器应直接进入应用。
    -->
    <div id="startup-layer" aria-hidden="true">
      <img src="/interweave-transparent.png" alt="" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
