version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    cmds:
      - go mod tidy

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task. Without run:once the two executions race:
    # one regenerates frontend/bindings while the other's bundler is reading it,
    # failing intermittently with 'Could not resolve "./bindings/<pkg>"' (#4637).
    run: once
    dir: frontend
    sources:
      - '**/*'
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      # turbo 已在 @greypan/interweave-frontend#build 里产出 dist 时，wails 内部再 bundle 一次既重复，
      # 又会覆盖不属于 app build 缓存输出的 dist。SKIP_FRONTEND 由 turbo 路径注入；dist/index.html
      # 是兜底，信号成立但产物缺失时仍照常构建。go-task 的 deps 不受此守卫影响，bindings 仍会生成，
      # 而它已从两个 build 的 inputs 排除，不会改变下一次 turbo hash。
      # 判定与 bundle 都由 node -e 驱动，而不是 POSIX `if [ ... ]`：Windows 的 cmd.exe 不认识 POSIX
      # 条件语法；node 子进程用 spawnSync 启动 pnpm，两个平台共用同一段逻辑。
      - cmd: >-
          node -e "const {spawnSync} = require('child_process');
          const command = process.env.PRODUCTION === 'true' ? 'build:bundle' : 'build:bundle:dev';
          if (process.env.SKIP_FRONTEND && require('fs').existsSync('dist/index.html')) {
          console.log('frontend bundle skipped: dist already built');
          process.exit(0);
          }
          const result = spawnSync('pnpm', ['run', command], {stdio: 'inherit', shell: process.platform === 'win32'});
          process.exit(result.status === null ? 1 : result.status)"
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    cmds:
      - node scripts/generate-bindings.mjs -f '{{.BUILD_FLAGS}}'{{if eq .OBFUSCATED "true"}} -obfuscated{{end}}

  generate:icons:
    summary: |-
      Generates Mac `.icns` (full-bleed square; macOS masks it into the squircle itself) and
      Windows `.ico` (macOS-style continuous squircle with hairline border and multi-DPI 16–256px frames,
      shared by both the Windows app icon and system tray icon) from `appicon.png`.
      The DMG volume icon is a darwin-only artifact and lives in `darwin:generate:dmg-icon`.
    run: once
    dir: build
    sources:
      - 'appicon.png'
      - '../scripts/generate-windows-icon/main.go'
    generates:
      - 'darwin/icons.icns'
      - 'windows/icon.ico'
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns
      - go run ../scripts/generate-windows-icon -input appicon.png -output windows/icon.ico

  dev:frontend:
    summary: Runs the frontend development server through the pnpm workspace
    cmds:
      - pnpm --dir frontend run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
