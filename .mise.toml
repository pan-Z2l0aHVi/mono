[tools]
node = "24.18.0"
pnpm = "12.4.0"
go = "1.26.4"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "3.0.0-beta.22"

[env]
# 主仓与全部 worktree 共享同一份 turbo 缓存，故锚定 git common dir 而非 workspace；
# 机制与手动回收见 docs/agents/build.md。CI 在 ci.yml 覆盖回 workspace 内路径，
# 否则 mise 注入的共享路径会让 actions/cache 静默失效。
TURBO_CACHE_DIR = "{{ exec(command='git -C ' ~ config_root ~ ' rev-parse --path-format=absolute --git-common-dir') | trim }}/turbo-cache"

# 仅 HERDR_ENV=1 且 TMPDIR 非空时执行探测：优先 macOS 默认路径，再试 Linux 默认路径，
# 两者都不可写才回落到 $TMPDIR/greypan/go-build。
# 探测的语义与降级行为见 docs/agents/build.md「Go 缓存探测与共享」，客户端权限边界见
# docs/agents/environments.md。
# CI 无 HERDR_ENV 时模板渲染为空，Go 使用平台默认路径，ci.yml 的 actions/cache 读取
# `go env GOCACHE` 不受影响。
# Tera 要求：探测 exec 必须 exit 0 且只输出一行；HERDR_ENV 在场而 TMPDIR 为空时条件判假，
# 避免渲染成根路径 /greypan/go-build。
GOCACHE = "{% if env.HERDR_ENV and env.TMPDIR %}{{ exec(command='DM1=$HOME/Library/Caches/go-build; DM2=$HOME/.cache/go-build; FB=$TMPDIR/greypan/go-build; P=$$; if (mkdir -p $DM1 && touch $DM1/.herdr-gocache-probe.$P) 2>/dev/null; then echo $DM1; rm -f $DM1/.herdr-gocache-probe.$P; elif (mkdir -p $DM2 && touch $DM2/.herdr-gocache-probe.$P) 2>/dev/null; then echo $DM2; rm -f $DM2/.herdr-gocache-probe.$P; else echo $FB; fi') | trim }}{% endif %}"
