[tools]
node = "24.18.0"
pnpm = "12.4.0"
go = "1.26.4"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "3.0.0-beta.22"

[env]
# 主仓与全部 worktree 共享同一份 turbo 缓存，故锚定 git common dir 而非 workspace；
# 机制与手动回收见 docs/agents/build.md。CI 在 ci.yml 覆盖回 workspace 内路径，
# 否则 mise 注入的共享路径会让 actions/cache 静默失效。
TURBO_CACHE_DIR = "{{ exec(command='git -C ' ~ config_root ~ ' rev-parse --path-format=absolute --git-common-dir') | trim }}/turbo-cache"

# Go 默认 GOCACHE（~/Library/Caches/go-build）在 herdr 的 seatbelt 沙箱里不可写，
# go build 会报 operation not permitted；HERDR_ENV=1 时改指 $TMPDIR 下的可写目录。
# HERDR_ENV 是 pane 级变量而非 agent 专属，任何 herdr pane（含交互与协调者 pane）都会命中，
# 代价是丢掉默认那份热缓存；herdr 的 agent 身份是 pane 属性（herdr pane current）而非 env，
# 做不到更窄的条件。CI 无 HERDR_ENV，回落默认路径，ci.yml 的 Go 缓存不受影响。
# 同时判 env.TMPDIR 是 Tera 的限制：HERDR_ENV 在场而 TMPDIR 未定义会渲染报 undefined
# 并带塌整个 .mise.toml；TMPDIR 为空串会渲染成根路径 /greypan/go-build。
GOCACHE = '{% if env.HERDR_ENV and env.TMPDIR %}{{ env.TMPDIR }}/greypan/go-build{% endif %}'
